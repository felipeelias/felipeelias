name: Latest blog posts
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: gautamkrishnar/blog-post-workflow@6a6e64abd1f651445da8e59611d0ca0110979aa5 # v1.9.4
        with:
          feed_list: "https://felipeelias.github.io/feed.xml"
          max_post_count: 5
          skip_commit: "true"
      - uses: felipeelias/actions/create-pull-request@9e198c3a2cdd6500b49ae9f0504dee527732411b # main
        with:
          branch: blog-post-update
          title: "chore: update blog posts in README"
          body: "Automated update of blog posts from RSS feed."
          add: README.md
